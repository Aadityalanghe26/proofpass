name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Compile Compact contract
        run: |
          if command -v compact &> /dev/null; then
            compact compile contracts/proofpass.compact --output managed/
            echo "Compact compile: SUCCESS"
          else
            echo "Compact compiler not installed — skipping (run locally: compact compile contracts/proofpass.compact)"
          fi

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload dist artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
